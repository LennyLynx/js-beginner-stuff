<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
</head>
<body>

    <h1>BMI CALCULATOR</h1>
    <p>Enter your weight and height below to calculate your Body Mass Index (BMI).</p>

    <p>
        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" class="js-weight" >
    </p>

    <p>
        <label for="height">Height (m):</label>
        <input type="number" id="height" class="js-height" >
    </p>

    <!--  buttons are connected to functions -->
    <p>
        <button onclick="calculateBMI()">Calculate BMI</button>
        <button onclick="clearBMI()">Clear</button>
    </p>

    <p id="result" class="js-result"></p>

    
    <script src="script.js"></script>
</body>
</html>
